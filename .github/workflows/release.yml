name: Publish release
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build the Claude connector
        run: npm run build:connector
      - name: Build the Windows installer
        shell: bash
        # Signed with Azure Trusted Signing once its secrets and variables are set (STORE-AND-UPDATES.md, part 3); unsigned until then.
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
          SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
          SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
          SIGN_PUBLISHER: ${{ vars.AZURE_SIGN_PUBLISHER }}
        run: |
          if [ -n "$AZURE_CLIENT_SECRET" ]; then
            npx electron-builder --win nsis --publish never \
              -c.win.azureSignOptions.endpoint="$SIGN_ENDPOINT" -c.win.azureSignOptions.codeSigningAccountName="$SIGN_ACCOUNT" \
              -c.win.azureSignOptions.certificateProfileName="$SIGN_PROFILE" -c.win.azureSignOptions.publisherName="$SIGN_PUBLISHER"
          else
            unset AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET   # empty values from unset secrets
            npx electron-builder --win nsis --publish never
          fi
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          ls -la dist
          FILES="dist/Study-Notebook-Setup-$V.exe dist/Study-Notebook-Setup-$V.exe.blockmap dist/latest.yml"
          NEW=$(node -e "global.window={};require('./renderer/whats-new.js');const n=window.SNWhatsNew.find(x=>x.v===process.argv[1]);if(n)console.log('**What is new**\\n\\n'+n.en.map(x=>'- '+x).join('\\n'))" "$V")
          cat > notes.md <<EOF
          Study Notebook $V

          $NEW

          **Windows:** download \`Study-Notebook-Setup-$V.exe\`. Installed apps update themselves.

          **Mac:** download \`Study-Notebook-$V-arm64.dmg\` for a Mac with Apple silicon (M1 or newer), or \`Study-Notebook-$V-x64.dmg\` for an Intel Mac. Open it and drag Study Notebook into Applications.
          The first time you open it, macOS may say it can't check the app for malicious software (it isn't signed with an Apple developer certificate yet). Open **System Settings → Privacy & Security**, scroll down and click **Open Anyway**. You only do this once.
          When a new version is out, the Mac app tells you and opens its download. Lecture recording works on Windows for now.
          EOF
          if gh release view "v$V" > /dev/null 2>&1; then
            gh release upload "v$V" $FILES --clobber
            gh release edit "v$V" --notes-file notes.md
          else
            gh release create "v$V" $FILES --title "Study Notebook $V" --notes-file notes.md --target "$GITHUB_SHA"
          fi

  # The Mac app, added to the same release once the Windows job has created it.
  mac:
    needs: windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build the Claude connector
        run: npm run build:connector
      - name: Build the Mac apps (Apple silicon and Intel)
        # Signed with your Developer ID and notarized once its secrets are set (STORE-AND-UPDATES.md, part 3); signed ad hoc until then.
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            npx electron-builder --mac dmg zip --arm64 --x64 --publish never -c.mac.identity="$APPLE_TEAM_ID" -c.mac.notarize=true -c.mac.hardenedRuntime=true
          else
            # GitHub passes unset secrets as empty values; an empty CSC_LINK makes electron-builder look for a certificate file.
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac dmg zip --arm64 --x64 --publish never
          fi
      - name: Add them to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          ls -la dist
          gh release upload "v$V" dist/Study-Notebook-$V-arm64.dmg dist/Study-Notebook-$V-x64.dmg dist/Study-Notebook-$V-arm64.zip dist/Study-Notebook-$V-x64.zip dist/latest-mac.yml --clobber

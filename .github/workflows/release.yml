name: Publish release

# When the app version in package.json changes on main (1.3.0 -> 1.3.1 ...), build
# the Windows installer and publish it as GitHub Release vX.Y.Z (electron-builder
# creates the tag). Installed copies of Study Notebook update themselves from
# these releases. Also runs by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the Claude connector
        run: npm run build:connector

      - name: Build and publish the Windows installer
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build installers

# Builds the Windows and Mac apps when you press "Run workflow" on GitHub
# (Actions tab). The files appear under that run's Artifacts.
# Releases for automatic updates are published separately.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the Claude connector
        run: npm run build:connector

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis zip --publish never

      - name: Build Mac app
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: Study-Notebook-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

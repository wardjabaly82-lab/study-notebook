<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' app:; script-src 'self' app: 'unsafe-inline'; style-src 'self' app: 'unsafe-inline'; font-src 'self' app: data:; img-src 'self' app: data: blob:">
<title>Study Notebook print</title>
<style>
/* The notes laid out for paper. Page size and margins come from the print
   settings; this file only controls how the content flows on the page. */
:root{ --ink:#111; --muted:#555; --rule:#999; --accent:#2b50c8; --soft:#eef2fc; --paper-line:rgba(43,80,200,.16); --fs:11.5pt }
html,body{margin:0;padding:0;background:#fff;color:var(--ink)}
body{font-family:"Source Serif 4","Frank Ruhl Libre","David","Times New Roman",Georgia,serif;font-size:var(--fs);line-height:1.55;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
body.ink{--accent:#111;--soft:transparent;--paper-line:transparent}

/* paper styles (printed as part of the page) */
body.grid{background-image:linear-gradient(var(--paper-line) 1px,transparent 1px),linear-gradient(90deg,var(--paper-line) 1px,transparent 1px);background-size:5mm 5mm}
body.lined{background-image:linear-gradient(transparent calc(8mm - 1px),var(--paper-line) calc(8mm - 1px));background-size:100% 8mm}
body.dotted{background-image:radial-gradient(circle,rgba(43,80,200,.32) .45px,transparent .7px);background-size:5mm 5mm}
body.ink.grid,body.ink.lined,body.ink.dotted{background-image:none}

/* the cover shares page 1 with the contents (or the first topic), so no sheet is spent on a title alone */
.cover{margin:0 0 1.5em;break-inside:avoid}
.cover .band{position:relative;overflow:hidden;background:var(--accent);color:#fff;border-radius:3mm;padding:9mm 10mm 8mm}
.cover .band::before,.cover .band::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.09)}
.cover .band::before{width:62mm;height:62mm;inset-inline-end:-16mm;top:-26mm}
.cover .band::after{width:30mm;height:30mm;inset-inline-end:34mm;bottom:-17mm;background:rgba(255,255,255,.06)}
.cover .kicker{position:relative;font-family:Rubik,"Segoe UI",Arial,sans-serif;font-size:.78em;font-weight:600;letter-spacing:.09em;text-transform:uppercase;opacity:.85}
.cover h1{position:relative;font-family:Rubik,"Segoe UI",Arial,sans-serif;font-size:2.7em;line-height:1.08;margin:.2em 0 0;letter-spacing:-.01em}
.cover .sub{position:relative;margin:.35em 0 0;font-size:1.2em;opacity:.92}
.cover .facts{display:flex;flex-wrap:wrap;gap:.35em 1.6em;margin:.9em 0 0;padding:0;list-style:none;font-family:Rubik,"Segoe UI",Arial,sans-serif;font-size:.9em;color:var(--muted)}
.cover .facts b{color:var(--ink);font-weight:600}
body.ink .cover .band{background:none;color:var(--ink);border:2px solid var(--ink)}
body.ink .cover .band::before,body.ink .cover .band::after{display:none}

.toc.cols{break-after:page}   /* a short contents list shares page 1 with the first topic */
.toc h2{font-family:Rubik,"Segoe UI",Arial,sans-serif;font-size:1.25em;margin:0 0 .5em;padding-bottom:.3em;border-bottom:1px solid var(--rule)}
.toc ol{list-style:none;margin:0;padding:0}
.toc.cols ol{columns:2;column-gap:10mm}
.toc li{margin:.25em 0;break-inside:avoid}
.toc li.d0{font-weight:600}
.toc li.d1{padding-inline-start:1.4em;color:var(--muted)}
.toc li.d2{padding-inline-start:2.8em;color:var(--muted);font-size:.92em}
.toc .num{display:inline-block;min-width:2.6em;font-variant-numeric:tabular-nums;color:var(--accent)}

.sec h2,.sec h3,.sec h4,.sec h5{font-family:Rubik,"Segoe UI",Arial,sans-serif;line-height:1.25;margin:0;break-after:avoid;page-break-after:avoid}
.sec .num{color:var(--accent);margin-inline-end:.45em;font-variant-numeric:tabular-nums}
.sec.d0{margin-top:1.6em}
.sec.d0:first-of-type{margin-top:0}
body.topic-breaks .sec.d0.not-first{break-before:page;page-break-before:always;margin-top:0}
.sec.d0 > .head h2{font-size:1.75em;padding-bottom:.25em;border-bottom:2px solid var(--ink);margin-bottom:.45em}
.sec.d1{margin-top:1.1em}
.sec.d1 > .head h3{font-size:1.3em;margin-bottom:.3em}
.sec.d2{margin-top:.9em}
.sec.d2 > .head h4{font-size:1.1em;margin-bottom:.2em}
.sec.d3 > .head h5,.sec.d4 > .head h5{font-size:1em;color:var(--muted);margin-bottom:.15em}
.sec .head{break-inside:avoid;break-after:avoid}

.body p{margin:.45em 0;orphans:3;widows:3}
.body ul,.body ol{margin:.4em 0;padding-inline-start:1.4em}
.body li{margin:.15em 0}
.body sup.cm-ref{font-family:Rubik,"Segoe UI",Arial,sans-serif;font-size:.7em;font-weight:600;color:var(--muted);margin-inline-start:.1em}
.body ol.sec-comments{margin:1em 0 0;padding:.5em 0 0;padding-inline-start:1.4em;border-top:1px solid var(--rule);font-size:.88em;font-style:italic;color:var(--muted)}
.body ol.sec-comments li{white-space:pre-wrap;margin:.25em 0}
.body table{border-collapse:collapse;margin:.6em 0;font-size:.93em;break-inside:avoid;max-width:100%}
.body th,.body td{border:1px solid var(--rule);padding:4px 8px;text-align:start;vertical-align:top}
.body th{background:var(--soft);font-family:Rubik,"Segoe UI",Arial,sans-serif;font-weight:600}
.body code{font-family:"JetBrains Mono",Consolas,"Courier New",monospace;font-size:.88em;background:var(--soft);padding:0 3px;border-radius:3px}
.body pre{background:var(--soft);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;white-space:pre-wrap;break-inside:avoid;direction:ltr;text-align:left}
.body pre code{background:none;padding:0}
.body blockquote{margin:.6em 0;padding:.1em 1em;border-inline-start:3px solid var(--accent);color:var(--muted)}
.body strong{font-weight:700}
/* Formulas a little smaller than the text, so they don't look bulky on paper */
mjx-container{direction:ltr;unicode-bidi:isolate;font-size:88%}
mjx-container[display="true"]{break-inside:avoid;margin:.6em 0!important;overflow:visible;max-width:100%}
/* A formula wider than the page shrinks to fit instead of being cut off */
mjx-container[display="true"] svg{max-width:100%;height:auto}
.body .fig svg.plot{max-width:150mm}
</style>
<!-- graphs, diagrams, colors, callouts, highlights and drawings: the same styles as on screen -->
<link rel="stylesheet" href="figures.css">
</head>
<body>
<main id="doc"></main>
<script>
window.MathJax = {
  tex: { inlineMath: [['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
  svg: { fontCache: 'local' },
  startup: { typeset: false },
  options: { enableMenu: false, menuOptions: { settings: { assistiveMml: false, explorer: false } } }
};
</script>
<script src="vendor/purify.min.js"></script>
<script src="vendor/mathjax/tex-svg.js"></script>
<script src="figures.js"></script>
<script src="marks.js"></script>
<script>
(() => {
  'use strict';
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clean = html => window.DOMPurify ? DOMPurify.sanitize(String(html || '')) : esc(html);
  const whenMath = () => new Promise(res => {
    const t0 = Date.now();
    (function wait() {
      const MJ = window.MathJax;
      if (MJ && MJ.typesetPromise && MJ.startup && MJ.startup.promise) MJ.startup.promise.then(res, res);
      else if (Date.now() - t0 > 8000) res();
      else setTimeout(wait, 50);
    })();
  });

  // payload: { course, lang, date, sections:[{id,title,depth,html}] }
  // opts:    { style, fontSize, contents, topicBreaks, ink, titlePage }
  // Comments print as numbered notes under their topic, so a long one doesn't break the sentence it's on.
  const notesBelow = body => {
    const ms = body.querySelectorAll('mark.note-end'); if (!ms.length) return;
    const ol = document.createElement('ol'); ol.className = 'sec-comments';
    ms.forEach((m, k) => {
      const sup = document.createElement('sup'); sup.className = 'cm-ref'; sup.textContent = k + 1; m.after(sup);
      const li = document.createElement('li'); li.setAttribute('dir', 'auto'); li.textContent = m.dataset.noteText; ol.appendChild(li);
      m.classList.remove('note-end');
    });
    body.appendChild(ol);
  };
  window.renderPrint = async ({ payload, opts }) => {
    const doc = document.getElementById('doc');
    const body = document.body;
    body.className = [opts.style || 'plain', opts.ink ? 'ink' : '', opts.topicBreaks ? 'topic-breaks' : ''].join(' ');
    body.style.setProperty('--fs', (Number(opts.fontSize) || 11.5) + 'pt');
    const rtl = payload.lang === 'he' || payload.lang === 'ar', ar = payload.lang === 'ar';
    // the few words the print page writes itself, in the notes language
    const W = ar ? { contents: 'المحتويات', topic: 'موضوع', topics: 'مواضيع', subs: 'مواضيع فرعية', exam: 'الامتحان:' }
      : rtl ? { contents: 'תוכן עניינים', topic: 'נושא', topics: 'נושאים', subs: 'תתי־נושאים', exam: 'מבחן:' }
      : { contents: 'Contents', topic: 'topic', topics: 'topics', subs: 'sub-topics', exam: 'Exam:' };
    document.documentElement.setAttribute('dir', rtl ? 'rtl' : 'ltr');
    document.documentElement.setAttribute('lang', ar ? 'ar' : rtl ? 'he' : 'en');

    // Number the sections like 1, 1.2, 1.2.1 so the contents page matches.
    const counters = []; const numbered = payload.sections.map(s => {
      counters.length = s.depth + 1; counters[s.depth] = (counters[s.depth] || 0) + 1;
      for (let i = 0; i < s.depth; i++) if (!counters[i]) counters[i] = 1;
      return { ...s, num: counters.slice(0, s.depth + 1).join('.') };
    });

    let html = '';
    if (opts.titlePage) {
      const tops = numbered.filter(s => s.depth === 0).length, subs = numbered.length - tops;
      const facts = [payload.date && esc(payload.date),
        tops && `<b>${tops}</b> ${tops === 1 ? W.topic : W.topics}${subs ? ` · <b>${subs}</b> ${W.subs}` : ''}`,
        payload.exam && `${W.exam} <b>${esc(payload.exam)}</b>`].filter(Boolean);
      html += `<header class="cover"><div class="band"><div class="kicker" dir="${rtl ? 'rtl' : 'ltr'}">${esc(payload.num && !String(payload.course).includes(payload.num) ? payload.num : 'Study Notebook')}</div><h1 dir="auto">${esc(payload.course)}</h1>${payload.subtitle ? `<p class="sub" dir="auto">${esc(payload.subtitle)}</p>` : ''}</div>`
        + `<ul class="facts">${facts.map(f => `<li>${f}</li>`).join('')}</ul></header>`;
    }
    if (opts.contents && numbered.length > 1) {
      const listed = numbered.filter(s => s.depth <= 2).length;
      html += `<section class="toc${listed > 14 ? ' cols' : ''}"><h2>${W.contents}</h2><ol>` +
        numbered.filter(s => s.depth <= 2).map(s => `<li class="d${s.depth}" dir="auto"><span class="num">${esc(s.num)}</span>${esc(s.title)}</li>`).join('') + '</ol></section>';
    }
    let first = true;
    for (const s of numbered) {
      const d = Math.min(s.depth, 4);
      const tag = ['h2', 'h3', 'h4', 'h5', 'h5'][d];
      html += `<section class="sec d${d}${s.depth === 0 && !first ? ' not-first' : ''}"><div class="head"><${tag} dir="auto"><span class="num">${esc(s.num)}</span>${esc(s.title)}</${tag}></div><div class="body">${clean(s.html)}</div></section>`;
      if (s.depth === 0) first = false;
    }
    doc.innerHTML = html;
    // Graphs, diagrams and callout boxes, drawn the same way as on screen.
    if (window.SNFig) { try { await SNFig.upgrade(doc); } catch (e) {} }
    doc.querySelectorAll('p,li,td,th,blockquote').forEach(n => n.setAttribute('dir', 'auto'));
    doc.querySelectorAll('pre').forEach(n => n.setAttribute('dir', 'ltr'));

    await whenMath();
    if (window.MathJax && MathJax.typesetPromise) { try { await MathJax.typesetPromise([doc]); } catch (e) {} }
    if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }
    // The student's own highlights and drawings, last (they sit on the finished text).
    if (opts.marks !== false && window.SNMarks) {
      const bodies = doc.querySelectorAll('section.sec > .body');
      numbered.forEach((s, i) => { const b = bodies[i]; if (!b) return; try { SNMarks.applyHighlights(b, s.marks); SNMarks.drawInk(b, s.ink); notesBelow(b); } catch (e) {} });
    }
    return { ok: true, sections: numbered.length };
  };
})();
</script>
</body>
</html>

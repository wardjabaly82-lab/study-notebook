<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' app:; script-src 'self' app: 'unsafe-inline'; style-src 'self' app: 'unsafe-inline'; font-src 'self' app: data:; img-src 'self' app: data: blob:; worker-src 'self' app: blob:; connect-src 'self' app:">
<title>Study Notebook</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#e5e4df" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18181a" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="vendor/fonts/rubik/index.css">
<link rel="stylesheet" href="vendor/fonts/frank-ruhl-libre/index.css">
<link rel="stylesheet" href="vendor/fonts/heebo/index.css">
<link rel="stylesheet" href="vendor/fonts/assistant/index.css">
<link rel="stylesheet" href="vendor/fonts/open-sans/index.css">
<link rel="stylesheet" href="vendor/fonts/noto-serif-hebrew/index.css">
<link rel="stylesheet" href="vendor/fonts/david-libre/index.css">
<link rel="stylesheet" href="vendor/fonts/alef/index.css">
<link rel="stylesheet" href="vendor/fonts/varela-round/index.css">
<link rel="stylesheet" href="vendor/fonts/amatic-sc/index.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="figures.css">
<script src="i18n.js"></script>
<script>
  // Apply the saved theme before anything draws, so there is no flash.
  (function () { var t = 'system', w = 'paper'; try { t = localStorage.getItem('sn-theme') || 'system'; w = localStorage.getItem('sn-warmth') || 'paper'; } catch (e) {} document.documentElement.setAttribute('data-theme', t); document.documentElement.setAttribute('data-warmth', w); try { if (localStorage.getItem('sn-shelf') === 'folded') document.documentElement.setAttribute('data-shelf', 'folded'); } catch (e) {} try { var r = document.documentElement, v = null, cid = localStorage.getItem('sn-course'); if (cid) v = JSON.parse(localStorage.getItem('sn-view:' + cid) || 'null'); if (!v && localStorage.getItem('sn-views') !== '1') v = { font: localStorage.getItem('sn-notefont'), zoom: +localStorage.getItem('sn-note-zoom'), pagew: +localStorage.getItem('sn-page-width'), hideContents: localStorage.getItem('sn-hide-contents') === '1', hideSlip: localStorage.getItem('sn-hide-slip') === '1' }; if (v) { if (v.font) r.setAttribute('data-notefont', v.font); if (v.zoom > 0) r.style.setProperty('--note-zoom', v.zoom); if (v.pagew >= 300) { r.setAttribute('data-pagew', v.pagew); r.style.setProperty('--page-w', v.pagew + 'px'); } if (v.hideContents) r.setAttribute('data-hide-contents', ''); if (v.hideSlip) r.setAttribute('data-hide-slip', ''); } } catch (e) {} if (window.desktop && window.desktop.isDesktop && window.desktop.platform !== 'darwin') document.documentElement.classList.add('frameless'); })();
</script>
</head>
<body>
<div class="drag-strip" aria-hidden="true"></div>
<div class="shell">
  <aside class="side" data-i18n-aria="Courses">
    <div class="brand">
      <svg class="brand-mark" width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="4" y="2.5" width="18" height="21" rx="3" fill="var(--cover)"/><rect x="7" y="2.5" width="2" height="21" fill="var(--cover-edge)"/><path d="M12 9h7M12 13h7M12 17h4.5" stroke="var(--on-cover)" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span class="brand-name">Study Notebook</span>
      <button class="icon-btn fold-btn" id="foldBtn" type="button" data-i18n-title="Fold the shelf" data-i18n-aria="Fold the shelf"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6.5 9 12l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="icon-btn search-all" id="searchAllBtn" type="button" data-i18n-title="Search all courses (Ctrl+K)" data-i18n-aria="Search all courses"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
    <button class="home-btn" id="homeBtn" type="button" data-i18n-title="Today: all your courses" aria-current="false"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.2 12 5l8 6.2V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span data-i18n="Today">Today</span></button>
    <nav class="courses" id="courses"></nav>
    <button class="new-course" id="newCourseBtn" type="button"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span data-i18n="New course">New course</span></button>
    <div class="side-foot">
      <button class="claude-pill" id="claudePill" type="button"></button>
      <div class="side-row">
        <button class="icon-btn" id="themeBtn" type="button"></button>
        <button class="text-btn" id="settingsBtn" type="button"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9M4 12h11M19 12h1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="15" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="17" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="17" cy="12" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span data-i18n="Settings">Settings</span></button>
      </div>
    </div>
  </aside>

  <main class="main" id="main">
    <section class="home" id="home" hidden></section>
    <header class="top" id="top"></header>
    <div class="body">
      <nav class="contents" id="contents" data-i18n-aria="Contents"></nav>
      <div class="sheet-wrap" id="sheetWrap"><article class="sheet" id="sheet"></article></div>
      <aside class="slip" id="slip" hidden></aside>
    </div>
  </main>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script>
window.MathJax = {
  tex: { inlineMath: [['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
  svg: { fontCache: 'local' },
  startup: { typeset: false },
  options: { enableMenu: false, menuOptions: { settings: { assistiveMml: false, explorer: false } } }
};
</script>
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="vendor/mathjax/tex-svg.js" async></script>
<script src="web-bridge.js"></script>
<script src="notebook-ops.js"></script>
<script src="practice-gen.js"></script>
<script src="study-timer.js"></script>
<script src="figures.js"></script>
<script src="gestures.js"></script>
<script src="marks.js"></script>
<script src="markup-ui.js"></script>
<script src="whats-new.js"></script>
<script src="app.js"></script>
<script src="print-ui.js"></script>
<script src="recorder.js"></script>
</body>
</html>
